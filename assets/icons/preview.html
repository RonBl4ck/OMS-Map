<!doctype html>
<html lang="es">
<meta charset="utf-8">
<title>Vista previa de iconos OMS Map</title>
<style>
  body { margin: 0; padding: 32px; background: #eef2f7; color: #273548; font: 14px/1.4 system-ui, sans-serif; }
  h1 { margin: 0 0 20px; font-size: 22px; }
  main { display: grid; grid-template-columns: repeat(5, minmax(130px, 1fr)); gap: 16px; }
  article { padding: 20px 12px; border: 1px solid #d8dee8; border-radius: 14px; background: white; text-align: center; box-shadow: 0 4px 14px #27354812; }
  .large { width: 64px; height: 64px; }
  .actual { width: 22px; height: 22px; margin-top: 14px; padding: 6px; border: 1px solid #d8dee8; border-radius: 50%; }
  strong, small { display: block; }
  strong { margin-top: 10px; }
  small { margin-top: 4px; color: #64748b; }
</style>
<h1>Nueva familia SVG · OMS Map</h1>
<main>
  <article><img class="large" src="suministro.svg"><strong>Suministro</strong><img class="actual" src="suministro.svg"><small>Tamaño del mapa</small></article>
  <article><img class="large" src="fusible.svg"><strong>Fusible</strong><img class="actual" src="fusible.svg"><small>Tamaño del mapa</small></article>
  <article><img class="large" src="red_aerea.svg"><strong>Red aérea</strong><img class="actual" src="red_aerea.svg"><small>Tamaño del mapa</small></article>
  <article><img class="large" src="subterranea.svg"><strong>Subterránea</strong><img class="actual" src="subterranea.svg"><small>Tamaño del mapa</small></article>
  <article><img class="large" src="poste.svg"><strong>Poste</strong><img class="actual" src="poste.svg"><small>Tamaño del mapa</small></article>
</main>
</html>
